name: CMake

on: [push, pull_request]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install gcc-multilib g++-multilib

    - uses: actions/checkout@v3

    - name: Running tests
      run: python run_tests.py
